name: Build tg-ws-proxy APK

on:
  push:
    branches: [ main ]
    tags: [ 'tgws-v*' ]
    paths:
      - 'tg-ws-proxy-android/**'
      - '.github/workflows/tgws-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tg-ws-proxy-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Rust library
        run: bash build_so.sh
        shell: bash

      - name: Build universal release APK
        run: ./gradlew assembleUniversalRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/universal/release/*.apk)
          ls -la "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging "$APK" | head -3

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-universal-release-unsigned
          path: tg-ws-proxy-android/app/build/outputs/apk/universal/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/tgws-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: tg-ws-proxy-universal-release-unsigned
          path: apks

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > keystore.jks
          [ -s keystore.jks ]
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]')
          APK=$(ls apks/*.apk)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$APK" aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks keystore.jks --ks-key-alias selfsign \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out signed.apk aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs signed.apk

      - name: Create GitHub release with signed APK
        uses: softprops/action-gh-release@v2
        with:
          files: signed.apk
          name: tg-ws-proxy ${{ github.ref_name }}
          body: Signed release build (universal APK). Built by GitHub Actions.
