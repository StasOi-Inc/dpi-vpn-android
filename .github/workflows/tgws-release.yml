name: Build tg-ws-proxy APK

on:
  push:
    branches: [ main ]
    paths:
      - 'tg-ws-proxy-android/**'
      - '.github/workflows/tgws-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tg-ws-proxy-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Rust library
        run: bash build_so.sh
        shell: bash

      - name: Build universal release APK
        run: ./gradlew assembleUniversalRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/universal/release/*.apk)
          ls -la "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging "$APK" | head -3

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-universal-release-unsigned
          path: tg-ws-proxy-android/app/build/outputs/apk/universal/release/*.apk
