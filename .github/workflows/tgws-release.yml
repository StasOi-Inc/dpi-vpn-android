name: Build tg-ws-proxy APK

on:
  push:
    branches: [ main ]
    tags: [ 'tgws-v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, macbuild]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tg-ws-proxy-android
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Раннер работает как launchd-сервис и не читает .zshrc,
      # поэтому окружение Mac (JAVA_HOME, ANDROID_HOME, PATH) подключаем явно в каждом run-шаге.
      - name: Install SDK components
        run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Rust library
        run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          bash build_so.sh
        shell: bash

      - name: Build release APKs
        run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          ./gradlew assembleArm32Release assembleArm64Release assembleUniversalRelease --no-daemon --stacktrace

      - name: Verify APKs
        run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          for f in arm32 arm64 universal; do
            APK=$(ls app/build/outputs/apk/$f/release/*.apk)
            echo "== $f: $APK"
            ls -la "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -3
          done

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-release-apks
          path: |
            tg-ws-proxy-android/app/build/outputs/apk/arm32/release/*.apk
            tg-ws-proxy-android/app/build/outputs/apk/arm64/release/*.apk
            tg-ws-proxy-android/app/build/outputs/apk/universal/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/tgws-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: tg-ws-proxy-release-apks
          path: apks

      - name: Remove legacy assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for old in signed.apk "tg-ws-proxy-*-release-signed.apk"; do
            gh release delete-asset "${{ github.ref_name }}" "$old" --yes || true
          done

      - name: Sign APKs
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > keystore.jks
          [ -s keystore.jks ]
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]')
          VERSION="${GITHUB_REF_NAME#tgws-v}"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          sign_flavor() {
            local flavor="$1" abi="$2"
            APK=$(find apks -name "app-${flavor}-release*.apk" | head -1)
            [ -n "$APK" ] || { echo "::error::APK for $flavor not found"; return 1; }
            OUT="tg-ws-proxy-${VERSION}-release-${abi}.apk"
            "$BT/zipalign" -f 4 "$APK" "${OUT}.aligned"
            "$BT/apksigner" sign \
              --ks keystore.jks --ks-key-alias selfsign \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
              --out "$OUT" "${OUT}.aligned"
            rm -f "${OUT}.aligned"
            "$BT/apksigner" verify --print-certs "$OUT"
          }
          sign_flavor arm32 armeabi-v7a
          sign_flavor arm64 arm64-v8a
          sign_flavor universal universal

      - name: Create GitHub release with signed APKs
        uses: softprops/action-gh-release@v2
        with:
          files: tg-ws-proxy-*-release-*.apk
          name: tg-ws-proxy ${{ github.ref_name }}
          body: Signed release builds (armeabi-v7a, arm64-v8a, universal). Built by GitHub Actions.
