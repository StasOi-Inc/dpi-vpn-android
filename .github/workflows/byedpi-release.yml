name: Build ByeDPI APK

on:
  push:
    branches: [ main ]
    tags: [ 'byedpi-v*' ]
    paths:
      - 'ByeDPIAndroid/**'
      - '.github/workflows/byedpi-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ByeDPIAndroid

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          ls -la "$APK"
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$APK" | head -3

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-release-unsigned
          path: ByeDPIAndroid/app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/byedpi-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: byedpi-release-unsigned
          path: apks

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          APK=$(ls apks/*.apk)
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 "$APK" aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks keystore.jks --ks-key-alias selfsign \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out signed.apk aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs signed.apk

      - name: Create GitHub release with signed APK
        uses: softprops/action-gh-release@v2
        with:
          files: signed.apk
          name: ByeDPI ${{ github.ref_name }}
          body: Signed release build (universal APK, all ABIs). Built by GitHub Actions.

