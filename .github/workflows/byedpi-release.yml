name: Build ByeDPI APK

on:
  push:
    branches: [ main ]
    paths:
      - 'ByeDPIAndroid/**'
      - '.github/workflows/byedpi-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ByeDPIAndroid

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          ls -la "$APK"
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$APK" | head -3

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-release-unsigned
          path: ByeDPIAndroid/app/build/outputs/apk/release/*.apk

