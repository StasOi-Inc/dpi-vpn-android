name: macbuild-runner-check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, macbuild]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          echo "host: $(hostname)  user: $(whoami)"
          sw_vers
          echo "java: $(java -version 2>&1 | head -1)"
          echo "gradle: $(gradle --version 2>/dev/null | grep '^Gradle' || echo missing)"
          echo "go: $(go version 2>/dev/null || echo missing)"
          echo "node: $(node --version 2>/dev/null || echo missing)"
          echo "sdk: $ANDROID_HOME"
        shell: bash